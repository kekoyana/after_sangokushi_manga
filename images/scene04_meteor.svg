<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <radialGradient id="skyNight" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#1e1022" />
      <stop offset="50%" stop-color="#0a0510" />
      <stop offset="100%" stop-color="#020105" />
    </radialGradient>
    <linearGradient id="meteorTail" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="20%" stop-color="#ffedd5" />
      <stop offset="50%" stop-color="#ea580c" />
      <stop offset="80%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="transparent" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#skyNight)" />

  <g fill="#ffffff" opacity="0.6">
    <circle cx="80" cy="50" r="1.5" />
    <circle cx="160" cy="90" r="1" />
    <circle cx="240" cy="40" r="2" />
    <circle cx="320" cy="110" r="1.5" />
    <circle cx="700" cy="60" r="1.5" />
    <circle cx="750" cy="140" r="1" />
    <circle cx="620" cy="100" r="2" />
    <circle cx="100" cy="200" r="1" />
    <circle cx="200" cy="160" r="1.5" />
  </g>

  <path d="M780 20 L250 360 L240 370 L790 10 Z" fill="url(#meteorTail)" opacity="0.5" filter="url(#glow)" />
  <path d="M750 30 L270 340 L260 350 L760 20 Z" fill="url(#meteorTail)" opacity="0.8" filter="url(#glow)" />
  <line x1="750" y1="30" x2="260" y2="350" stroke="#ffedd5" stroke-width="6" filter="url(#glow)" />
  <line x1="750" y1="30" x2="260" y2="350" stroke="#ffffff" stroke-width="2" />

  <circle cx="260" cy="350" r="28" fill="#ea580c" opacity="0.6" filter="url(#glow)" />
  <circle cx="260" cy="350" r="16" fill="#f97316" filter="url(#glow)" />
  <circle cx="260" cy="350" r="8" fill="#ffffff" />

  <path d="M0 380 Q200 370 400 380 T800 370 L800 450 L0 450 Z" fill="#000000" />
  <polygon points="220,400 270,350 320,400" fill="#050508" stroke="#7f1d1d" stroke-width="1" />

  <text x="320" y="240" font-family="'Yuji Boku', serif" font-size="44" font-weight="900" fill="#ef4444" opacity="0.85" filter="url(#glow)">ズオォォォォンッ！！</text>
  <text x="280" y="420" font-family="'Shippori Mincho', serif" font-size="16" font-weight="bold" fill="#fca5a5" letter-spacing="4">【建興十二年秋 巨星落つ】</text>
</svg>
